name: Google-таблицы — ежедневная выгрузка

# Запускается сам каждый день и наполняет таблицы клиентов свежими данными Директа.
# Работает в облаке GitHub — компьютер пользователя НЕ нужен.
#
# Перед первым запуском задать два секрета репозитория (Settings → Secrets and variables → Actions):
#   YANDEX_OAUTH_TOKEN — OAuth-токен Яндекса (тот же, что в secrets.json; нужен доступ Директ + Метрика)
#   GOOGLE_SA_KEY      — содержимое JSON-ключа сервисного аккаунта (sa_key.json целиком)

on:
  schedule:
    # GitHub запускает расписание «когда освободятся раннеры», и опоздание бывает большим:
    # за первую декаду августа разброс дошёл до +3ч28м (03.08 старт в 08:28 UTC = 11:28 МСК).
    # Поэтому берём запас: основной прогон в 03:00 UTC (06:00 МСК) укладывается в «до 11:00»
    # даже с таким опозданием, а второй — подстраховка, если первый не поднялся вовсе.
    # Повтор безопасен: выгрузка обновляет строку периода на месте, а не дописывает вторую.
    - cron: "0 3 * * *"          # 06:00 МСК — основной
    - cron: "30 5 * * *"         # 08:30 МСК — подстраховка
  workflow_dispatch:             # + кнопка ручного запуска во вкладке Actions
    inputs:
      check:
        description: "Только проверить токен (ничего не писать в таблицы)"
        type: boolean
        default: false
      breakdowns:
        description: "Пересоздать листы-разрезы за текущий месяц"
        type: boolean
        default: false
      notify:
        description: "Написать клиентам в чат, что отчёт обновлён (только тем, кто в IIG_SYNC_NOTIFY)"
        type: boolean
        default: false

concurrency:
  group: gsheets-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: python -m pip install --upgrade pip requests gspread google-auth

      - name: Подготовка ключей из секретов
        # ВАЖНО: ключи кладём в КОРЕНЬ репозитория (а не в app/) — load_secrets читает корень
        # раньше app/, иначе ensure_secrets_template() создаёт там заглушку и затирает реальный токен.
        env:
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          if [ -z "$YANDEX_OAUTH_TOKEN" ] || [ -z "$GOOGLE_SA_KEY" ]; then
            echo "::error::Не заданы секреты YANDEX_OAUTH_TOKEN и/или GOOGLE_SA_KEY в настройках репозитория."
            exit 1
          fi
          printf '%s' "$GOOGLE_SA_KEY" > sa_key.json
          python -c "import json,os; json.dump({'yandex_oauth_token': os.environ['YANDEX_OAUTH_TOKEN'].strip()}, open('secrets.json','w'))"

      - name: Выгрузка в Google-таблицы
        working-directory: app
        # TELEGRAM_BOT_TOKEN и IIG_SYNC_NOTIFY — необязательные. Пока их нет, --notify просто
        # печатает «некому писать» и ничего не отправляет: включение оповещений — отдельное
        # решение, а не побочный эффект выката.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IIG_SYNC_NOTIFY: ${{ secrets.IIG_SYNC_NOTIFY }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            python -c "import json,os; p='../secrets.json'; s=json.load(open(p)); s['telegram_bot_token']=os.environ['TELEGRAM_BOT_TOKEN'].strip(); json.dump(s,open(p,'w'))"
          fi
          python -m iigbot gsheets-sync ${{ (github.event_name == 'workflow_dispatch' && inputs.check) && '--check' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.breakdowns) && '--breakdowns' || '' }} ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.notify)) && '--notify' || '' }}

      - name: Убрать ключи
        if: always()
        run: rm -f sa_key.json secrets.json
